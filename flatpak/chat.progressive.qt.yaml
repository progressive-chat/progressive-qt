id: chat.progressive.qt
runtime: org.kde.Platform
runtime-version: 5.11
sdk: org.kde.Sdk
command: progressive-chat
finish-args:
- --share=ipc
- --share=network
- --socket=x11
- --socket=wayland
- --device=dri
- --filesystem=home
- --talk-name=org.freedesktop.Notifications
- --talk-name=org.kde.StatusNotifierWatcher
modules:
- name: progressive-chat
  buildsystem: qmake
  sources:
  - type: dir
    path: ../
