name: Android APK (Qt 5.6)
# Builds Progressive Chat Qt for Android with the era toolchain:
# Qt 5.6.3 + NDK r10e + SDK android-14, ant + JDK 8.
# A local APK build is intentionally NOT supported on aarch64 dev boxes
# (NDK r10e host tools are x86_64-only); CI is the real Android toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r10e
      QT56_PREFIX: ${{ github.workspace }}/qt56-install
      # Qt sources/builds live OUTSIDE the repo checkout: qmlimportscanner
      # scans the repo (qml-root-path), and Qt's own test .qml files inside
      # the checkout would drown it in noise.
      QT56_WORK: /tmp/qt56-work
    steps:
      - uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ant make perl python3 qtbase5-dev \
            libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libdbus-1-dev libglib2.0-dev unzip curl

      - name: Set up JDK 17 (SDK manager)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Android SDK packages
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-10" "platforms;android-14" "platforms;android-16" "build-tools;24.0.3"

      - name: Install legacy SDK Tools (Qt 5.6 androiddeployqt needs tools/android)
        # NOTE: must be r25.2.x — newer tools dropped `android update project`,
        # and ant templates (tools/ant/) were removed after 25.3.
        run: |
          curl -o sdtools.zip https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip -q sdtools.zip -d "$ANDROID_SDK_ROOT"
          test -x "$ANDROID_SDK_ROOT/tools/android"

      - name: Set up JDK 8 (Qt + ant builds)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install NDK r10e
        run: |
          curl -o ndk.zip https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q ndk.zip -d "${{ github.workspace }}"
          "$ANDROID_NDK_ROOT/ndk-build" --version || true

      - name: Fetch Qt 5.6.3 sources
        run: |
          mkdir -p "$QT56_WORK"
          cd "$QT56_WORK"
          curl -o qt-5.6.3.tar.xz https://download.qt.io/archive/qt/5.6/5.6.3/single/qt-everywhere-opensource-src-5.6.3.tar.xz
          tar -xf qt-5.6.3.tar.xz

      - name: Build Qt 5.6.3 for Android (armeabi-v7a, API 14)
        run: |
          cd "$QT56_WORK/qt-everywhere-opensource-src-5.6.3"
          ./configure -prefix "$QT56_PREFIX" \
            -release -opensource -confirm-license \
            -xplatform android-g++ \
            -android-sdk "$ANDROID_SDK_ROOT" \
            -android-ndk "$ANDROID_NDK_ROOT" \
            -android-ndk-host linux-x86_64 \
            -c++std c++11 -no-openssl -no-icu \
            -nomake examples -nomake tests \
            -skip qt3d -skip qtactiveqt -skip qtcanvas3d \
            -skip qtconnectivity -skip qtdoc -skip qtenginio -skip qtimageformats \
            -skip qtlocation -skip qtmacextras -skip qtmultimedia \
            -skip qtscript -skip qtsensors -skip qtserialport -skip qtsvg \
            -skip qtquickcontrols2 -skip qttools -skip qtwayland -skip qtwebchannel \
            -skip qtwebengine -skip qtwebview -skip qtwebsockets \
            -skip qtwinextras -skip qtx11extras -skip qtxmlpatterns
          make -j"$(nproc)"
          make install
          "$QT56_PREFIX/bin/qmake" -query QT_VERSION

      - name: Build androiddeployqt (host tool, lives in skipped qttools)
        run: |
          g++ -o "$GITHUB_WORKSPACE/androiddeployqt" \
            "$QT56_WORK/qt-everywhere-opensource-src-5.6.3/qttools/src/androiddeployqt/main.cpp" \
            -fPIC -DQT_NO_CAST_FROM_ASCII -DQT_NO_CAST_TO_ASCII -DQT_NO_EXCEPTIONS \
            $(pkg-config --cflags Qt5Core) $(pkg-config --libs Qt5Core) -lpthread
          "$GITHUB_WORKSPACE/androiddeployqt" --help 2>&1 | head -n 3 || true

      - name: Build app + APK
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$QT56_PREFIX/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          mkdir -p app-build && cd app-build
          "$QT56_PREFIX/bin/qmake" "$GITHUB_WORKSPACE/progressive-qt.pro"
          make -j"$(nproc)"
          make install INSTALL_ROOT=android-build
          echo "=== deployment-settings.json ==="
          cat android-libprogressive-chat.so-deployment-settings.json
          echo "=== manual qmlimportscanner run (expect our QtQuick.* modules resolved) ==="
          "$QT56_PREFIX/bin/qmlimportscanner" -rootPath "$GITHUB_WORKSPACE/" \
            -importPath "$QT56_PREFIX/qml" "$GITHUB_WORKSPACE/" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d), 'entries'); print([e.get('name') for e in d if e.get('path','').startswith('$QT56_PREFIX')][:12])"
          "$GITHUB_WORKSPACE/androiddeployqt" --verbose \
            --input android-libprogressive-chat.so-deployment-settings.json \
            --output android-build --deployment bundled --ant /usr/bin/ant
          find android-build -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: progressive-chat-qt-apk
          path: app-build/android-build/bin/*.apk
